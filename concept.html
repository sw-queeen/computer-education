<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS.im — 정보컴퓨터 임용</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="crt-overlay" aria-hidden="true"></div>
<div class="layout">

  <header class="topbar">
    <div class="topbar-logo" onclick="location.href='index.html'" style="cursor:pointer;">CS.im<span class="cursor-blink">_</span></div>
    <div class="topbar-breadcrumb" id="breadcrumb"></div>
    <div class="topbar-search prompt-style">
      <span class="search-icon">&gt;</span>
      <input type="text" id="conceptSearch" placeholder="grep concept...">
    </div>
    <button class="topbar-menu-btn" onclick="toggleSidebar()" aria-label="메뉴">☰</button>
  </header>

  <div class="body-row">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>

</div>

<button class="scroll-top-btn" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script>
/* ── URL 파라미터 ─────────────────────────────────── */
function getParam(key) { return new URLSearchParams(location.search).get(key); }
const subjectName = getParam('subject') || '';
const conceptName = getParam('concept') ? decodeURIComponent(getParam('concept')) : '';

/* ── 시각화 / 콘텐츠 매핑 ──────────────────────────── */
const VIZ_MAP = {
  '피아제 인지발달 4단계':       'visualizations/piaget.js',
  '부울 대수·게이트·카르노맵':   'visualizations/boole.js',
  '가네 9가지 수업사태':         'visualizations/gagne.js',
  '마르시아 정체성 지위':        'visualizations/marcia.js',
  '브론펜브레너 생태학적 체계':  'visualizations/bronfenbrenner.js',
  '문맥교환 (Context Switch)':   'visualizations/context-switch.js',
};
const CONTENT_MAP = {
  '피아제 인지발달 4단계':       'visualizations/piaget-content.js',
  '부울 대수·게이트·카르노맵':   'visualizations/boole-content.js',
  '가네 9가지 수업사태':         'visualizations/gagne-content.js',
  '마르시아 정체성 지위':        'visualizations/marcia-content.js',
  '브론펜브레너 생태학적 체계':  'visualizations/bronfenbrenner-content.js',
  '문맥교환 (Context Switch)':   'visualizations/context-switch-content.js',
};

/* ── 사이드바 토글 ─────────────────────────────────── */
function isMobile() { return window.innerWidth <= 768; }

function toggleSidebar() {
  if (isMobile()) {
    const isOpen = document.getElementById('sidebar').classList.contains('mobile-open');
    isOpen ? closeSidebar() : openSidebar();
  } else {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
    const menuBtn = document.querySelector('.topbar-menu-btn');
    if (menuBtn) menuBtn.textContent = sidebar.classList.contains('collapsed') ? '☰' : '✕';
    try { localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0'); } catch(e) {}
  }
}

function openSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar.classList.contains('sidebar-ready')) {
    sidebar.classList.add('sidebar-ready');
  }
  sidebar.classList.add('mobile-open');
  document.getElementById('sidebarOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
  const menuBtn = document.querySelector('.topbar-menu-btn');
  if (menuBtn) menuBtn.textContent = '✕';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('visible');
  document.body.style.overflow = '';
  const menuBtn = document.querySelector('.topbar-menu-btn');
  if (menuBtn) menuBtn.textContent = '☰';
}

window.addEventListener('resize', () => {
  if (!isMobile()) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('visible');
    document.body.style.overflow = '';
    const menuBtn = document.querySelector('.topbar-menu-btn');
    if (menuBtn) menuBtn.textContent = '☰';
    try {
      const sidebar = document.getElementById('sidebar');
      const saved = localStorage.getItem('sidebar-collapsed');
      if (saved === '1') sidebar.classList.add('collapsed');
      else sidebar.classList.remove('collapsed');
    } catch(e) {}
  }
});

try {
  if (!isMobile() && localStorage.getItem('sidebar-collapsed') === '1') {
    document.getElementById('sidebar').classList.add('collapsed');
  }
} catch(e) {}

/* ── 사이드바 렌더 ─────────────────────────────────── */
function renderSidebar() {
  const areas = {};
  Object.entries(SUBJECTS).forEach(([name, meta]) => {
    if (!areas[meta.area]) areas[meta.area] = [];
    areas[meta.area].push(name);
  });
  let html = '';
  Object.entries(areas).forEach(([area, subjects]) => {
    html += `<div class="sidebar-section"><div class="sidebar-section-title">${area}</div>`;
    subjects.forEach(name => {
      const s = SUBJECTS[name];
      const active = subjectName === name ? 'active' : '';
      const style = `--subject-bg:${s.color.bg};--subject-mid:${s.color.mid};--subject-accent:${s.color.accent};--subject-text:${s.color.text}`;
      html += `<div class="sidebar-item ${active}" style="${style}"
        onclick="location.href='index.html?subject=${encodeURIComponent(name)}'">
        <span class="sidebar-dot" style="background:${s.color.mid}"></span>${name}</div>`;
    });
    html += `</div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}

/* ── 브레드크럼 ────────────────────────────────────── */
function renderBreadcrumb() {
  document.getElementById('breadcrumb').innerHTML = `
    <a href="index.html">홈</a>
    <span class="sep">›</span>
    <a href="index.html?subject=${encodeURIComponent(subjectName)}">${subjectName}</a>
    <span class="sep">›</span>
    <span style="color:var(--text-primary);">${conceptName}</span>`;
  if (conceptName) document.title = `${conceptName} — CS.im`;
}

/* ── Concept / Note 모드 토글 ──────────────────────── */
function setConceptMode(mode) {
  document.getElementById('mode-concept').classList.toggle('active', mode === 'concept');
  document.getElementById('mode-note').classList.toggle('active', mode === 'note');
  document.getElementById('btn-concept').classList.toggle('active', mode === 'concept');
  document.getElementById('btn-note').classList.toggle('active', mode === 'note');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Explore 탭 전환 ─────────────────────────────── */
function switchExploreTab(tab) {
  document.querySelectorAll('.explore-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.explore-tab-content').forEach(c => c.classList.remove('active'));
  const btn = document.querySelector(`.explore-tab-btn[data-tab="${tab}"]`);
  if (btn) btn.classList.add('active');
  const content = document.getElementById(`content-${tab}`);
  if (content) content.classList.add('active');

  /* viz 탭 lazy-load */
  if (tab === 'viz' && !window._vizLoaded) {
    window._vizLoaded = true;
    const vizFile = VIZ_MAP[conceptName];
    const container = document.getElementById('viz-container');
    if (vizFile && container) {
      const s = document.createElement('script');
      s.src = vizFile;
      s.onerror = () => { container.innerHTML = `<div class="content-placeholder">시각화를 불러올 수 없어요.</div>`; };
      document.body.appendChild(s);
    } else if (container) {
      container.innerHTML = `<div class="content-placeholder">아직 시각화가 준비되지 않았어요.</div>`;
    }
  }
}

/* ── 키워드 그래프 빌드 ───────────────────────────── */
function buildKeywordGraph(nodes, edges, containerId) {
  const wrap = document.getElementById(containerId || 'kwGraphWrap');
  if (!wrap) return;
  const W = 640, H = 320;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="kwSvg">`;
  svg += `<g id="kwEdgeLayer">`;
  edges.forEach((e, i) => {
    svg += `<line class="kw-edge" id="kwEdge${i}" x1="0" y1="0" x2="0" y2="0"/>`;
  });
  svg += `</g><g id="kwNodeLayer">`;
  nodes.forEach(n => {
    const fill = n.core ? 'var(--subject-accent)' : 'var(--subject-bg)';
    const textColor = n.core ? '#fff' : 'var(--subject-text)';
    const fontSize = n.core ? 13 : n.r >= 18 ? 11.5 : 10;
    svg += `<g class="kw-node-group" id="kwNode-${n.id}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
      <circle class="kw-node-circle" r="${n.r}" fill="${fill}"/>
      <text class="kw-node-text" text-anchor="middle" dominant-baseline="central" font-size="${fontSize}" font-weight="700" fill="${textColor}">${n.label}</text>
    </g>`;
  });
  svg += `</g></svg>`;
  wrap.innerHTML = svg;

  function updateEdges() {
    edges.forEach(([a, b], i) => {
      const na = nodes.find(n => n.id === a), nb = nodes.find(n => n.id === b);
      if (!na || !nb) return;
      const edge = document.getElementById('kwEdge' + i);
      if (edge) {
        edge.setAttribute('x1', na.x); edge.setAttribute('y1', na.y);
        edge.setAttribute('x2', nb.x); edge.setAttribute('y2', nb.y);
      }
    });
  }
  updateEdges();

  /* ── 드래그 ── */
  const svgEl = document.getElementById('kwSvg');
  if (!svgEl) return;
  let dragging = null;

  function svgPoint(evt) {
    const rect = svgEl.getBoundingClientRect();
    const cx = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
      x: (cx - rect.left) / rect.width * W,
      y: (cy - rect.top) / rect.height * H
    };
  }

  nodes.forEach(n => {
    const g = document.getElementById('kwNode-' + n.id);
    if (!g) return;
    g.style.cursor = 'grab';
    const startDrag = evt => { evt.preventDefault(); dragging = n; g.style.cursor = 'grabbing'; };
    g.addEventListener('mousedown', startDrag);
    g.addEventListener('touchstart', startDrag, { passive: false });
  });

  svgEl.addEventListener('mousemove', evt => {
    if (!dragging) return;
    const p = svgPoint(evt);
    dragging.x = Math.max(dragging.r, Math.min(W - dragging.r, p.x));
    dragging.y = Math.max(dragging.r, Math.min(H - dragging.r, p.y));
    const g = document.getElementById('kwNode-' + dragging.id);
    if (g) g.setAttribute('transform', `translate(${dragging.x},${dragging.y})`);
    updateEdges();
  });
  svgEl.addEventListener('touchmove', evt => {
    if (!dragging) return;
    const p = svgPoint(evt);
    dragging.x = Math.max(dragging.r, Math.min(W - dragging.r, p.x));
    dragging.y = Math.max(dragging.r, Math.min(H - dragging.r, p.y));
    const g = document.getElementById('kwNode-' + dragging.id);
    if (g) g.setAttribute('transform', `translate(${dragging.x},${dragging.y})`);
    updateEdges();
  }, { passive: false });
  function endDrag() {
    if (dragging) {
      const g = document.getElementById('kwNode-' + dragging.id);
      if (g) g.style.cursor = 'grab';
    }
    dragging = null;
  }
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('touchend', endDrag);
}

/* ── 개념 키워드로 기본 그래프 자동 생성 ─────────── */
function buildAutoKeywordGraph(conceptNameStr, keywordsStr) {
  const kws = keywordsStr.split(/[·,·\s]+/).map(k => k.trim()).filter(k => k.length > 0);
  const cx = 320, cy = 155;
  const nodes = [{ id: 'core', label: conceptNameStr.replace(/\s*\(.+\)/, ''), x: cx, y: cy, r: 28, core: true }];
  const edges = [];
  const count = Math.min(kws.length, 10);
  kws.slice(0, count).forEach((kw, i) => {
    const angle = (i / count) * 2 * Math.PI - Math.PI / 2;
    const dist = 120;
    const r = kw.length > 5 ? 14 : 12;
    nodes.push({ id: `kw${i}`, label: kw, x: Math.round(cx + dist * Math.cos(angle)), y: Math.round(cy + dist * Math.sin(angle)), r });
    edges.push(['core', `kw${i}`]);
  });
  return { nodes, edges };
}

/* ── 파일 로드 ─────────────────────────────────────── */
function loadContent(name) {
  const f = CONTENT_MAP[name];
  if (!f) return;
  const id = 'cs-' + name.replace(/[^a-zA-Z0-9가-힣]/g, '_');
  if (document.getElementById(id)) return;
  const s = document.createElement('script');
  s.id = id;
  s.src = f;
  document.body.appendChild(s);
}

/* ── 메인 렌더 ─────────────────────────────────────── */
function renderConcept() {
  const C = SITE_CONFIG;
  const s = SUBJECTS[subjectName];
  const concept = CONCEPTS.find(c => c.subject === subjectName && c.name === conceptName);
  if (!s || !concept) {
    document.getElementById('main').innerHTML = `
      <div style="padding:40px;text-align:center;color:var(--text-tertiary);">
        ${C.ui.notFound} <a href="index.html" style="color:var(--text-secondary);">${C.ui.goHome}</a>
      </div>`;
    return;
  }
  const main = document.getElementById('main');
  main.style.setProperty('--subject-bg',     s.color.bg);
  main.style.setProperty('--subject-mid',    s.color.mid);
  main.style.setProperty('--subject-accent', s.color.accent);
  main.style.setProperty('--subject-text',   s.color.text);
  /* Editorial 레이아웃: main 패딩 제거 (ed-page가 자체 패딩 관리) */
  main.style.padding = '0';

  const hasViz = !!VIZ_MAP[conceptName];

  main.innerHTML = `
    <!-- ── 상단 고정: 스크롤 프로그레스 + 모드 토글 ── -->
    <div class="sticky-header-group" id="conceptStickyHeader">
      <div class="scroll-progress">
        <div class="scroll-progress-bar" id="scrollProgressBar"></div>
      </div>
      <div class="mode-toggle-sticky">
        <div class="mode-toggle">
          <button class="mode-toggle-btn active" id="btn-concept" onclick="setConceptMode('concept')">Concept</button>
          <button class="mode-toggle-btn" id="btn-note" onclick="setConceptMode('note')">Note</button>
        </div>
      </div>
    </div>

    <!-- ── Editorial 본문 ── -->
    <div class="ed-page" id="edPage">
      <div class="ed-eyebrow">${subjectName} · ${concept.chapter}</div>
      <div class="ed-title">${concept.name}</div>
      <div class="ed-lede">${concept.keywords}</div>

      <!-- ── Explore: 키워드 그래프 / 인터랙티브 시각화 ── -->
      <div class="explore-tabs">
        <div class="explore-tab-buttons">
          <button class="explore-tab-btn active" data-tab="kw" onclick="switchExploreTab('kw')">키워드 그래프</button>
          ${hasViz ? `<button class="explore-tab-btn" data-tab="viz" onclick="switchExploreTab('viz')">인터랙티브 시각화</button>` : ''}
        </div>
        <div class="explore-tab-content active" id="content-kw">
          <div class="keyword-graph-wrap" id="kwGraphWrap"></div>
        </div>
        ${hasViz ? `<div class="explore-tab-content" id="content-viz"><div id="viz-container"></div></div>` : ''}
      </div>

      <!-- ── Concept 모드 패널 ── -->
      <div class="mode-panel active" id="mode-concept">
        <div id="tab-summary">
          <div class="ed-section">
            <div class="ed-h2"><span class="num">—</span> ${C.summary.intro}</div>
            <div class="content-placeholder">
              이 개념의 핵심 정리 내용을 여기에 작성하세요.<br>
              <small style="margin-top:8px;display:block;">키워드: ${concept.keywords}</small>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Note 모드 패널 ── -->
      <div class="mode-panel" id="mode-note">
        <div id="tab-exam">
          <div class="ed-section">
            <div class="content-placeholder">${C.tabs.exam} 내용을 작성하세요.</div>
          </div>
        </div>
        <div id="tab-quiz"></div>
      </div>
    </div>`;

  /* ── 키워드 그래프 초기화 ── */
  function initKeywordGraph() {
    const customNodes = window.CONCEPT_KW_NODES;
    const customEdges = window.CONCEPT_KW_EDGES;
    if (customNodes && customEdges) {
      buildKeywordGraph(customNodes, customEdges, 'kwGraphWrap');
    } else {
      const { nodes, edges } = buildAutoKeywordGraph(concept.name, concept.keywords);
      buildKeywordGraph(nodes, edges, 'kwGraphWrap');
    }
  }
  initKeywordGraph();

  /* ── 콘텐츠 로드 ── */
  loadContent(conceptName);
}

/* ── 스크롤 이벤트 ─────────────────────────────────── */
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTopBtn');
  if (btn) btn.classList.toggle('visible', window.scrollY > 400);
  const bar = document.getElementById('scrollProgressBar');
  if (bar) {
    const total = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (total > 0 ? (window.scrollY / total) * 100 : 0) + '%';
  }
});

/* ── 초기화 ────────────────────────────────────────── */
renderSidebar();
renderBreadcrumb();
renderConcept();

/* ── concept.html 내 인라인 검색 ──────────────────── */
(function() {
  const input = document.getElementById('conceptSearch');
  if (!input) return;

  const dropdown = document.createElement('div');
  dropdown.id = 'searchDropdown';
  dropdown.style.cssText = 'position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--bg-white);border:1px solid var(--border-light);border-radius:0;box-shadow:none;z-index:500;max-height:320px;overflow-y:auto;display:none;';
  input.parentElement.style.position = 'relative';
  input.parentElement.appendChild(dropdown);

  function showResults(q) {
    if (!q) { dropdown.style.display = 'none'; return; }
    const results = CONCEPTS.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.keywords.toLowerCase().includes(q) ||
      c.subject.toLowerCase().includes(q)
    ).slice(0, 12);

    if (!results.length) {
      dropdown.innerHTML = '<div style="padding:14px 16px;font-size:13px;color:var(--text-tertiary);">검색 결과 없음</div>';
    } else {
      dropdown.innerHTML = results.map(c => {
        const subj = SUBJECTS[c.subject];
        return `<div onmousedown="location.href='concept.html?subject=${encodeURIComponent(c.subject)}&concept=${encodeURIComponent(c.name)}'"
          style="padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border-light);font-size:13px;"
          onmouseover="this.style.background='var(--bg-surface)'" onmouseout="this.style.background=''">
          <div style="font-weight:600;color:var(--text-primary);">${c.name}</div>
          <div style="font-size:11px;color:${subj?.color.accent || 'var(--text-tertiary)'};">${c.subject} › ${c.chapter}</div>
        </div>`;
      }).join('');
    }
    dropdown.style.display = 'block';
  }

  input.addEventListener('input', function() {
    showResults(this.value.trim().toLowerCase());
  });

  input.addEventListener('blur', () => {
    setTimeout(() => { dropdown.style.display = 'none'; }, 150);
  });
})();
</script>
</body>
</html>

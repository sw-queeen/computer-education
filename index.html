<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS.im — 컴퓨터·정보 개념 학습</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="layout">

  <header class="topbar">
    <div class="topbar-logo" onclick="navigate({subject:null,chapter:null,concept:null})" style="cursor:pointer;">CS.im</div>
    <div class="topbar-search" id="searchWrap">
      <span class="search-icon" id="searchIcon">
        <span class="search-icon-glyph search-icon-default">🔍</span>
        <span class="search-icon-glyph search-icon-typing">➤</span>
      </span>
      <input type="text" id="globalSearch" placeholder="개념 검색..." autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchDropdown">
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <button class="topbar-menu-btn" onclick="toggleSidebar()" aria-label="메뉴">☰</button>
  </header>

  <div class="body-row">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script>
/* ── 유틸 ─────────────────────────────────────────── */
function setSubjectVars(subjectName, el) {
  const s = SUBJECTS[subjectName];
  if (!s) return;
  el.style.setProperty('--subject-bg',     s.color.bg);
  el.style.setProperty('--subject-mid',    s.color.mid);
  el.style.setProperty('--subject-accent', s.color.accent);
  el.style.setProperty('--subject-text',   s.color.text);
}
function getParam(key) {
  return new URLSearchParams(location.search).get(key);
}
function navigate(params) {
  if (params.concept) {
    const p = new URLSearchParams();
    if (params.subject) p.set('subject', params.subject);
    if (params.chapter) p.set('chapter', params.chapter);
    p.set('concept', params.concept);
    location.href = 'concept.html?' + p.toString();
    return;
  }
  const url = new URL(location.href);
  Object.keys(params).forEach(k => {
    if (params[k] == null) url.searchParams.delete(k);
    else url.searchParams.set(k, params[k]);
  });
  history.pushState({}, '', url);
  render();
}

/* ── 사이드바 토글 ─────────────────────────────────────
   화면 크기와 무관하게 오른쪽에서 열리는 오버레이 드로어 하나로 통일.
   기본값은 항상 닫힘 — "매번 떠 있지 않도록" 필요할 때만 연다. ── */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
  const menuBtn = document.querySelector('.topbar-menu-btn');
  if (menuBtn) { menuBtn.textContent = '✕'; menuBtn.setAttribute('aria-label', '메뉴 닫기'); }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('visible');
  document.body.style.overflow = '';
  const menuBtn = document.querySelector('.topbar-menu-btn');
  if (menuBtn) { menuBtn.textContent = '☰'; menuBtn.setAttribute('aria-label', '메뉴 열기'); }
}

function toggleSidebar() {
  const isOpen = document.getElementById('sidebar').classList.contains('open');
  isOpen ? closeSidebar() : openSidebar();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSidebar();
});

/* ── 사이드바 렌더 (영역별 드롭다운 + 과목 그리드) ──── */
let sidebarOpenArea = null; // 사이드바 안에서 펼쳐진 영역 (edu/info/cs)

function toggleSidebarArea(areaKey) {
  sidebarOpenArea = sidebarOpenArea === areaKey ? null : areaKey;
  renderSidebar();
}

function renderSidebar() {
  const areas = {};
  Object.entries(SUBJECTS).forEach(([name, meta]) => {
    if (!areas[meta.area]) areas[meta.area] = [];
    areas[meta.area].push(name);
  });

  // 처음 렌더 시, 현재 열려 있는 과목이 속한 영역을 기본으로 펼쳐 둔다.
  if (sidebarOpenArea === null && openSubject && SUBJECTS[openSubject]) {
    sidebarOpenArea = SUBJECTS[openSubject].areaKey;
  }

  let html = '';
  Object.entries(SITE_CONFIG.areas).forEach(([areaKey, areaLabel]) => {
    const subjects = areas[areaLabel];
    if (!subjects) return;
    const isOpen = sidebarOpenArea === areaKey;
    html += `
      <div class="sb-area ${isOpen ? 'open' : ''}">
        <button class="sb-area-head" onclick="toggleSidebarArea('${areaKey}')">
          <span class="sb-area-head-left">
            <span class="sb-area-title">${areaLabel}</span>
            <span class="sb-area-count">${subjects.length}</span>
          </span>
          <span class="sb-area-chevron">›</span>
        </button>
        <div class="sb-area-body">
          <div class="sb-subject-grid">
            ${subjects.map(name => {
              const s = SUBJECTS[name];
              const active = openSubject === name ? 'active' : '';
              const style = `--subject-bg:${s.color.bg};--subject-mid:${s.color.mid};--subject-accent:${s.color.accent};--subject-text:${s.color.text}`;
              return `<div class="sb-subject-chip ${active}" style="${style}"
                onclick="goHomeAndOpen('${name}'); closeSidebar();">
                <span class="sidebar-dot" style="background:${s.color.mid}"></span>${name}</div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}

/* ── 홈 렌더 (학습 로드맵: 대분류 아이콘 레일 + 중분류 목록 + 카드 대시보드) ──
   과목 목록을 아코디언으로 세로로 쭉 펼치던 방식 대신, 커리큘럼 지도를
   보듯 왼쪽에서 대분류→중분류를 고르면 오른쪽 카드 그리드만 가볍게
   다시 그려지는 3단 구조로 바꿨다. */
let openSubject = null;    // 현재 우측에 펼쳐진 과목명
let selectedArea = null;   // 현재 좌측 레일에서 선택된 대분류 (edu/info/cs)

function subjectsByArea(areaKey) {
  return Object.keys(SUBJECTS).filter(name => SUBJECTS[name].areaKey === areaKey);
}

function renderHome() {
  const C = SITE_CONFIG;
  const total     = CONCEPTS.length;
  const highCount = CONCEPTS.filter(c => c.freq === '높음').length;
  const vizCount  = CONCEPTS.filter(c => c.viz).length;

  const html = `
    <div class="home-hero">
      <div class="hero-glow hero-glow-a" aria-hidden="true"></div>
      <div class="hero-glow hero-glow-b" aria-hidden="true"></div>
      <div class="hero-glow hero-glow-c" aria-hidden="true"></div>
      <div class="hero-content">
        <div class="hero-eyebrow">${C.siteName} · 개념 학습 노트</div>
        <h1 class="hero-big">Computer<br><span class="hero-dim">Education</span></h1>
        <p class="hero-desc">${C.heroDesc}</p>
        <div class="hero-stats">
          <div class="hero-stat"><div class="hero-stat-num">${total}</div><div class="hero-stat-label">개념 카드</div></div>
          <div class="hero-stat"><div class="hero-stat-num">${highCount}</div><div class="hero-stat-label">${C.freq.high}</div></div>
          <div class="hero-stat"><div class="hero-stat-num">${vizCount}</div><div class="hero-stat-label">${C.badges.viz}</div></div>
        </div>
        <button class="test-link-btn" onclick="location.href='test-design.html'"><span class="test-link-btn-icon">→</span>디자인 실험 — 문맥교환 (Bento / Editorial)</button>
      </div>
    </div>
    <div class="roadmap" id="roadmap"></div>`;

  document.getElementById('main').innerHTML = html;
  renderRoadmap();
}

/* 대분류(아이콘 레일)를 바꾸면, 그 안의 첫 중분류를 자동으로 선택해
   우측이 비어 보이지 않게 한다. */
function selectArea(areaKey) {
  if (areaKey === selectedArea) return;
  selectedArea = areaKey;
  const first = subjectsByArea(areaKey)[0];
  if (first) selectSubject(first);
  else renderRoadmap();
}

/* 중분류 선택 — 우측 카드 그리드와 좌측 목록의 active 표시만 다시 그린다
   (페이지 전체를 새로고침하지 않는 가벼운 갱신). */
function selectSubject(name) {
  if (!SUBJECTS[name]) return;
  openSubject = name;
  selectedArea = SUBJECTS[name].areaKey;
  const url = new URL(location.href);
  url.searchParams.set('subject', name);
  history.pushState({}, '', url);
  renderRoadmap();
  renderSidebar();
}

/* 사이드바 드로어 등 다른 진입점에서 특정 과목을 열 때 사용 */
function goHomeAndOpen(name) {
  selectSubject(name);
  const title = document.getElementById('roadmapMainTitle');
  if (title) title.scrollIntoView({ behavior: 'smooth', block: 'start' });
  else window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderRoadmap() {
  const C = SITE_CONFIG;
  const roadmap = document.getElementById('roadmap');
  if (!roadmap) return;

  const railHtml = Object.entries(C.areas).map(([areaKey, areaLabel]) => `
    <button class="rail-item ${selectedArea === areaKey ? 'active' : ''}" onclick="selectArea('${areaKey}')">
      <span class="rail-mark">${C.areaMarks[areaKey] || ''}</span>
      <span class="rail-label">${areaLabel}</span>
    </button>`).join('');

  const subjectNames = subjectsByArea(selectedArea);
  const subjectListHtml = subjectNames.map(name => {
    const s = SUBJECTS[name];
    const count = CONCEPTS.filter(c => c.subject === name).length;
    const active = openSubject === name ? 'active' : '';
    const style = `--subject-bg:${s.color.bg};--subject-mid:${s.color.mid};--subject-accent:${s.color.accent};--subject-text:${s.color.text}`;
    return `
      <button class="rs-item ${active}" style="${style}" onclick="selectSubject('${name}')">
        <span class="rs-dot" style="background:${s.color.mid}"></span>
        <span class="rs-name">${name}</span>
        <span class="rs-count">${count}</span>
      </button>`;
  }).join('');

  const s = SUBJECTS[openSubject];
  const concepts = s ? CONCEPTS.filter(c => c.subject === openSubject) : [];
  const highCount = concepts.filter(c => c.freq === '높음').length;
  const vizCount  = concepts.filter(c => c.viz).length;
  const freqLabel = f => f === '높음' ? C.freq.high : f === '중간' ? C.freq.mid : C.freq.low;
  const freqClass = f => f === '높음' ? 'badge-high' : f === '중간' ? 'badge-mid' : 'badge-low';

  const mainHtml = !s ? '' : `
    <div class="roadmap-main-header">
      <div class="roadmap-main-eyebrow">${s.area}</div>
      <div class="roadmap-main-title" id="roadmapMainTitle">${openSubject}</div>
      <div class="page-meta roadmap-main-meta">
        <span class="count">${concepts.length}개 개념</span>
        <span>${C.freq.high} ${highCount}개</span>
        <span>${C.badges.viz} ${vizCount}개</span>
      </div>
    </div>
    <div class="card-grid">
      ${concepts.map(c => `
        <div class="concept-card"
          onclick="navigate({subject:'${openSubject}',chapter:'${encodeURIComponent(c.chapter)}',concept:'${encodeURIComponent(c.name)}'})">
          <div class="concept-card-name">${c.name}</div>
          <div class="concept-card-keywords">${c.keywords}</div>
          <div class="concept-card-footer">
            <span class="badge ${freqClass(c.freq)}">${freqLabel(c.freq)}</span>
            ${c.viz  ? `<span class="badge badge-quiz">${C.badges.viz}</span>` : ''}
            ${c.quiz ? `<span class="badge badge-quiz">${C.badges.quiz}</span>` : ''}
          </div>
        </div>`).join('')}
    </div>`;

  roadmap.innerHTML = `
    <div class="roadmap-rail">${railHtml}</div>
    <div class="roadmap-subjects">
      <div class="roadmap-subjects-title">${C.areas[selectedArea] || ''}</div>
      <div class="roadmap-subject-list">${subjectListHtml}</div>
    </div>
    <div class="roadmap-main">${mainHtml}</div>`;
}

/* ── 과목 렌더 ─────────────────────────────────────── */
function renderSubject(subjectName) {
  const C = SITE_CONFIG;
  const s = SUBJECTS[subjectName];
  if (!s) return renderHome();
  const concepts = CONCEPTS.filter(c => c.subject === subjectName);
  const chapters = [...new Set(concepts.map(c => c.chapter))];
  setSubjectVars(subjectName, document.getElementById('main'));
  const highC = concepts.filter(c => c.freq === '높음').length;
  const vizC  = concepts.filter(c => c.viz).length;
  const freqLabel = f => f==='높음'?C.freq.high : f==='중간'?C.freq.mid : C.freq.low;
  const freqClass = f => f==='높음'?'badge-high' : f==='중간'?'badge-mid' : 'badge-low';
  let html = `
    <div class="page-header">
      <div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;">
        <span onclick="navigate({subject:null,chapter:null,concept:null})" style="cursor:pointer;">홈</span>
        <span style="margin:0 6px;">›</span>${subjectName}
      </div>
      <div class="page-title">${subjectName}</div>
      <div class="page-meta">
        <span>${s.area}</span>
        <span class="count">${concepts.length}개 개념</span>
        <span>${C.freq.high} ${highC}개</span>
        <span>${C.badges.viz} ${vizC}개</span>
      </div>
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all"  onclick="applyFilter('all')">${C.filters.all}</button>
      <button class="filter-btn"        data-filter="high" onclick="applyFilter('high')">${C.filters.high}</button>
      <button class="filter-btn"        data-filter="viz"  onclick="applyFilter('viz')">${C.filters.viz}</button>
      <button class="filter-btn"        data-filter="quiz" onclick="applyFilter('quiz')">${C.filters.quiz}</button>
    </div>
    <div id="chaptersContainer">`;
  chapters.forEach(chapter => {
    const cc = concepts.filter(c => c.chapter === chapter);
    html += `<div class="chapter-section" data-chapter="${chapter}">
      <div class="chapter-title" style="background:${s.color.bg};color:${s.color.text};">
        ${chapter} <span style="font-weight:400;opacity:.7;">${cc.length}</span>
      </div>
      <div class="card-grid">`;
    cc.forEach(concept => {
      html += `<div class="concept-card"
        data-freq="${concept.freq}" data-viz="${concept.viz}" data-quiz="${concept.quiz}"
        onclick="navigate({subject:'${subjectName}',chapter:'${encodeURIComponent(chapter)}',concept:'${encodeURIComponent(concept.name)}'})">
        <div class="concept-card-name">${concept.name}</div>
        <div class="concept-card-keywords">${concept.keywords}</div>
        <div class="concept-card-footer">
          <span class="badge ${freqClass(concept.freq)}">${freqLabel(concept.freq)}</span>
          ${concept.viz  ? `<span class="badge badge-quiz">${C.badges.viz}</span>` : ''}
          ${concept.quiz ? `<span class="badge badge-quiz">${C.badges.quiz}</span>` : ''}
        </div></div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById('main').innerHTML = html;
  setSubjectVars(subjectName, document.getElementById('main'));
}

function applyFilter(filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
  document.querySelectorAll('.concept-card').forEach(card => {
    let show = true;
    if (filter === 'high') show = card.dataset.freq === '높음';
    if (filter === 'viz')  show = card.dataset.viz  === 'true';
    if (filter === 'quiz') show = card.dataset.quiz === 'true';
    card.style.display = show ? '' : 'none';
  });
  document.querySelectorAll('.chapter-section').forEach(sec => {
    const visible = [...sec.querySelectorAll('.concept-card')].some(c => c.style.display !== 'none');
    sec.style.display = visible ? '' : 'none';
  });
}

/* ── 검색 (포커스 시 펼쳐지는 드롭다운) ──────────────────
   ActionSearchBar 패턴: 포커스 → 목록 펼침(스태거 페이드업),
   입력 디바운스 필터링, 아이콘 🔍→➤ 모핑, 클릭 시 이동,
   블러 200ms 지연 후 닫힘. 디자인은 DESIGN_SYSTEM.md 뉴모피즘
   토큰(box-shadow 이중 그림자·보더리스·rounded)을 그대로 사용. */
(function () {
  const wrap     = document.getElementById('searchWrap');
  const input    = document.getElementById('globalSearch');
  const dropdown = document.getElementById('searchDropdown');
  const MAX_RESULTS = 8;

  let query = '';
  let isFocused = false;
  let debounceTimer = null;
  let blurTimer = null;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  }

  function filterConcepts(q) {
    const norm = q.trim().toLowerCase();
    if (!norm) return CONCEPTS.slice(0, MAX_RESULTS);
    return CONCEPTS.filter(c =>
      c.name.toLowerCase().includes(norm) ||
      c.keywords.toLowerCase().includes(norm) ||
      c.subject.toLowerCase().includes(norm)
    ).slice(0, MAX_RESULTS);
  }

  function renderDropdown() {
    if (!isFocused) { dropdown.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); return; }

    const results = filterConcepts(query);
    if (!results.length) {
      dropdown.innerHTML = `<div class="search-dropdown-empty">"${escapeHtml(query)}"에 대한 결과가 없어요</div>`;
    } else {
      const items = results.map((c, i) => {
        const s = SUBJECTS[c.subject];
        const dotColor = s ? s.color.mid : 'var(--border-mid)';
        return `<li class="search-result-item" style="animation-delay:${(i * 0.05).toFixed(2)}s"
            data-subject="${encodeURIComponent(c.subject)}"
            data-chapter="${encodeURIComponent(c.chapter)}"
            data-concept="${encodeURIComponent(c.name)}">
          <span class="search-result-left">
            <span class="search-result-dot" style="background:${dotColor}"></span>
            <span class="search-result-name">${escapeHtml(c.name)}</span>
            <span class="search-result-desc">${escapeHtml(c.chapter)}</span>
          </span>
          <span class="search-result-right">
            <span class="search-result-freq">${escapeHtml(c.freq)}</span>
            <span class="search-result-subject">${escapeHtml(c.subject)}</span>
          </span>
        </li>`;
      }).join('');
      dropdown.innerHTML = `<ul class="search-dropdown-list">${items}</ul>
        <div class="search-dropdown-footer">
          <span>클릭해서 이동</span><span>Esc 닫기</span>
        </div>`;
    }
    dropdown.classList.add('open');
    input.setAttribute('aria-expanded', 'true');
  }

  function goToResult(item) {
    clearTimeout(blurTimer);
    isFocused = false;
    dropdown.classList.remove('open');
    input.setAttribute('aria-expanded', 'false');
    input.value = '';
    query = '';
    wrap.classList.remove('is-typing');
    navigate({
      subject: decodeURIComponent(item.dataset.subject),
      chapter: decodeURIComponent(item.dataset.chapter),
      concept: decodeURIComponent(item.dataset.concept),
    });
  }

  input.addEventListener('input', function () {
    query = this.value;
    wrap.classList.toggle('is-typing', query.length > 0);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderDropdown, 200);
  });

  input.addEventListener('focus', function () {
    isFocused = true;
    renderDropdown();
  });

  input.addEventListener('blur', function () {
    clearTimeout(blurTimer);
    blurTimer = setTimeout(function () {
      isFocused = false;
      dropdown.classList.remove('open');
      input.setAttribute('aria-expanded', 'false');
    }, 200); // 클릭 이벤트가 먼저 등록되도록 지연
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      isFocused = false;
      dropdown.classList.remove('open');
      input.setAttribute('aria-expanded', 'false');
      this.blur();
    }
  });

  dropdown.addEventListener('click', function (e) {
    const item = e.target.closest('.search-result-item');
    if (item) goToResult(item);
  });
})();

/* ── 라우터 ────────────────────────────────────────── */
function render() {
  const subject = getParam('subject');
  if (subject && SUBJECTS[subject]) {
    openSubject = subject;
    selectedArea = SUBJECTS[subject].areaKey;
  } else {
    if (!selectedArea) selectedArea = Object.keys(SITE_CONFIG.areas)[0];
    if (!openSubject || !SUBJECTS[openSubject] || SUBJECTS[openSubject].areaKey !== selectedArea) {
      openSubject = subjectsByArea(selectedArea)[0] || null;
    }
  }
  renderSidebar();
  renderHome();
}

window.addEventListener('popstate', render);
render();
</script>
</body>
</html>
